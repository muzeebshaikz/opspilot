# Monitoring stack. NOT RUN LOCALLY -- authored for review.
#   docker compose -f docker-compose.yml -f infra/monitoring/docker-compose.monitoring.yml up
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/opspilot.json:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./infra/monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    ports: ["4318:4318", "4317:4317"]
